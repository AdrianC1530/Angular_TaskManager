<div class="board-container">
  <header class="board-header">
    <h1>My Tasks</h1>
    <button class="btn-primary" (click)="toggleAddTask()">
      {{ isAdding ? 'Cancel' : '+ New Task' }}
    </button>
  </header>

  <div class="filters glass-panel">
    <button class="filter-btn" [class.active]="filter() === 'all'" (click)="setFilter('all')">All</button>
    <button class="filter-btn" [class.active]="filter() === 'pending'" (click)="setFilter('pending')">Pending</button>
    <button class="filter-btn" [class.active]="filter() === 'completed'" (click)="setFilter('completed')">Completed</button>
  </div>

  <div class="add-task-form glass-panel" *ngIf="isAdding">
    <input type="text" placeholder="Task title..." [(ngModel)]="newTask.title" class="input-field" (keyup.enter)="addTask()" />
    <textarea placeholder="Description (optional)..." [(ngModel)]="newTask.description" class="input-field"></textarea>
    
    <div class="form-row">
      <select [(ngModel)]="newTask.category_id" class="input-field">
        <option [ngValue]="null">No Category</option>
        <option *ngFor="let cat of categories()" [ngValue]="cat.id">{{ cat.name }}</option>
      </select>
      
      <input type="date" [(ngModel)]="newTask.due_date" class="input-field" />
    </div>

    <button class="btn-success" (click)="addTask()">Save Task</button>
  </div>

  <div class="tasks-grid">
    <div class="task-card glass-panel" *ngFor="let task of filteredTasks()" [ngClass]="{'completed': task.status === 'completed'}">
      <div class="task-content">
        <div class="task-header">
          <h3 class="task-title" [class.strike]="task.status === 'completed'">{{ task.title }}</h3>
          <span class="badge category-badge" *ngIf="task.category" [style.backgroundColor]="task.category.color">
            {{ task.category.name }}
          </span>
        </div>
        <p class="task-desc" *ngIf="task.description">{{ task.description }}</p>
        <div class="task-meta" *ngIf="task.due_date">
          <span class="due-date">📅 Due: {{ task.due_date | date }}</span>
        </div>
      </div>
      
      <div class="task-actions">
        <button class="btn-icon" (click)="toggleStatus(task)" [title]="task.status === 'pending' ? 'Mark Completed' : 'Mark Pending'">
          <span class="icon">{{ task.status === 'pending' ? '○' : '●' }}</span>
        </button>
        <button class="btn-icon delete-btn" (click)="deleteTask(task.id)" title="Delete">
          <span class="icon">×</span>
        </button>
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredTasks().length === 0">
      <p>No tasks found in this view.</p>
    </div>
  </div>
</div>
